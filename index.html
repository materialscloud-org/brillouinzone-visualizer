<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bz-visualizer demo</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: rgb(180, 237, 252);
      }
      .card {
        max-width: 760px;
        margin: 0 auto;
        padding: 12px;
        border-radius: 8px;
        background: #fff;
      }
      .header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        margin-bottom: 10px;
      }
      .header h3 {
        margin: 0;
      }
      #example {
        font-size: 14px;
        padding: 3px 6px;
      }
      #note {
        color: #666;
        font-size: 13px;
      }
      #viz {
        height: 600px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h3>bz-visualizer</h3>
        <select id="example" aria-label="Example"></select>
        <span id="note"></span>
      </div>
      <div id="viz"></div>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
