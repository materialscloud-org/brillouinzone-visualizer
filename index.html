<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bz-visualizer demo</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: rgb(180, 237, 252);
      }
      h3 {
        margin: 0 0 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 16px;
      }
      .card {
        background: #fff;
        border-radius: 8px;
        padding: 12px;
      }
      .viz {
        height: 520px;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="card">
        <h3>mc3d-10 (seekpath)</h3>
        <div id="bz-1" class="viz"></div>
      </div>
      <div class="card">
        <h3>mc3d-10016 (seekpath, path points)</h3>
        <div id="bz-2" class="viz"></div>
      </div>
      <div class="card">
        <h3>file2.bxsf + fcc k-path</h3>
        <div id="fs" class="viz"></div>
      </div>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
