<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bz-visualizer demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
        color: #222;
      }
      .panels {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 16px;
      }
      .plot {
        height: 480px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .legend label {
        margin-right: 10px;
        cursor: pointer;
      }
      .swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 4px;
        border-radius: 2px;
      }
      #status {
        color: #666;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="panels">
      <section>
        <h3>Brillouin zone (seekpath JSON)</h3>
        <div class="controls">
          <select id="bz-file">
            <option value="mc3d-10">mc3d-10</option>
            <option value="mc3d-10016">mc3d-10016</option>
          </select>
          <label><input type="checkbox" id="bz-pathpoints" /> path points</label>
        </div>
        <div id="bz-plot" class="plot"></div>
      </section>

      <section>
        <h3>Fermi surface (BXSF, no resampling)</h3>
        <div class="controls">
          <select id="fs-file">
            <option value="file2">file2.bxsf (fcc, 46³)</option>
            <option value="example">example.bxsf (hex, 61×61×41)</option>
            <option value="file1">file1.bxsf (fcc, 46³, 19 bands)</option>
            <option value="file3">file3.bxsf (fcc, 68³)</option>
          </select>
          <label>E − E<sub>F</sub> <input type="range" id="fs-energy" min="-1" max="1" step="0.01" value="0" /></label>
          <span id="fs-energy-label">0.00 eV</span>
          <label><input type="checkbox" id="fs-clip" checked /> clip to BZ</label>
        </div>
        <div class="controls legend" id="fs-legend"></div>
        <div id="fs-plot" class="plot"></div>
        <div id="status"></div>
      </section>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
